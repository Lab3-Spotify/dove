apiVersion: v1
kind: PersistentVolume
metadata:
  name: glitchtip-db-pv
spec:
  capacity:
    storage: {{ .Values.storage.size }}
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: {{ .Values.storage.reclaimPolicy }}
  hostPath:
    path: {{ .Values.storage.hostPath }}
    type: DirectoryOrCreate
